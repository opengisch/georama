# BUILD

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

# Information required for building (sdist/wheel)
## Also renders on pypi as 'subtitle'
[project]
name = "georama"
version = "0.0.1"
description = "The habitat of geoanimals"
authors = [
    {name="Clemens Rudert", email="clemens@opengis.ch"}
]
requires-python = ">=3.10.4"
maintainers = [
    {name="Clemens Rudert", email="clemens@opengis.ch"}
]
# license = "AGPL-3.0-only"
urls.Tracker = "https://github.com/georama/issues"
urls.CI = "https://github.com/opengisch/georama/actions"
urls.Documentation = "https://opengisch.github.io/georama"
urls.Source = "https://github.com/opengisch/georama"
urls.Changelog = "https://github.com/opengisch/georama/blob/master/CHANGELOG.md"
urls.Contributing = "https://github.com/opengisch/georama/blob/master/CONTRIBUTING.md"
keywords = [
    "python package",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Natural Language :: English",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]


### Dependency Constraints, aka Requirements ###
dependencies = [
    # cli tooling
    "click==8.1.7",
    # pygeoapi and its friends
    "pygeoapi @ git+https://github.com/opengisch/pygeoapi.git@respect-property-setting-in-ogr-provider",
    "psycopg2",
    "geoalchemy2",
    # django stuff
    "django==5.0.6",
    "django-jazzmin==3.0.0",
    "xsdata[cli,lxml,soap]==24.12",
    "async-timeout==4.0.3",
    "redis==5.0.8",
    "qgis_server_light @ git+https://github.com/opengisch/qgis-server-light.git@export-field-types",
    # deps for webgis
    "django-allauth==0.63.3",
    "django-cors-headers==4.3.1",
    "django-treebeard==4.7.1",
    "django-admin-sortable2==2.2.1",
    "django-simple-history==3.7.0",
    "django-extensions==3.2.3"
]

# DEV: deps
optional-dependencies.dev =[
    # to derive dataclasses from xsd schemas
    "xsdata[cli,lxml,soap]==24.12"
]

# Test: packages imported in test code and packages required for the "test runner"
optional-dependencies.test = [
    "pytest==8.0.0",
    "pytest-cov==5.0.0",
    "pytest-explicit==1.0.1",
    "pytest-xdist==3.5.0",
    "pytest-click==1.1.0",
    "pytest-run-subprocess==0.10.0"
]
# Type Checking
optional-dependencies.check =[
    "mypy==1.8.0"
]
# Docs: dev and build dependencies
optional-dependencies.docs = [
    "mkdocs==1.6.1",
    "mkdocs-macros-plugin==1.0.5",
    "mkdocs-material==9.5.34",
    "mkdocs-mermaid2-plugin==1.1.1",
    "mkdocs-section-index==0.3.8",
    "mkdocs-gen-files==0.5.0",
    "mkdocstrings==0.28.2",
    "mkdocstrings-python==1.16.2",
    "mkdocs-literate-nav==0.6.1",
    "mkdocs-autorefs==1.4.0",
    "pymdown-extensions==10.5",
    "mkdocs-click==0.8.1",
    "griffe==1.2.0"
]

[tool.setuptools.dynamic]
version = {attr = "georama.version"}  # any module attribute compatible with ast.literal_eval
readme = {file = ["README.md", "CHANGELOG.md"]}

[tool.setuptools.packages.find]
where = ["src"]

# TOOLS
[tool.pytest.ini_options]
minversion = "6.2"
addopts = "--strict-markers"
markers = [
    "slow: Marks a slow test",
    "integration: Integration Tests",
    "network_bound: Require internet connection",
]
testpaths = [
    "tests",
]
explicit-only = [
    "integration",
    "network_bound",
]

[tool.black]
line-length = 95
include = '\.pyi?$'
extend-exclude = '''
'''

[tool.isort]
profile = 'black'

[tool.bandit]
tests = []
skips = [
    "B101",
]

[tool.software-release]
version_variable = "src/georama/__init__.py:__version__"

[virtualenvs]
create = true
in-project = true
