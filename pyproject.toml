[project]
name = "georama"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Clemens Rudert", email = "crud3_rt@posteo.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "django[argon2]>=6.0.6",
    "django-configurations>=2.5.1",
    "django-cors-headers>=4.9.0",
    "django-filter>=25.2",
    "django-guardian>=3.3.1",
    "psycopg[pool]>=3.3.4",
    "django-unfold>=0.96.0",
    "uvicorn>=0.49.0",
    "django-formset>=2.2.4",
    "django-extensions>=4.1",
    "djangorestframework>=3.17.1",
    "drf-spectacular[sidecar]>=0.29.0",
    "djangorestframework-gis>=1.2.1",
    "django-allauth[socialaccount]>=65.18.0",
]

[project.scripts]
manage = "georama.manage:main"
[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "lint-format" },
    { include-group = "test" },
    "django-extensions>=4.1",
    "django-silk>=5.5.0",
    "factory-boy>=3.3.3",
    "pre-commit",
]
lint-format = [
    "ruff>=0.15.15",
]
test = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "pytest-lazy-fixtures>=1.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "src/georama/maps/interfaces/**",
    "src/georama/*/migrations/**",
]
[tool.ruff.lint]
extend-select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "Q", # Quotes
    "UP", # pyupgrade replacement
    "B", # bugbear
    "SIM", # simplify
    "I", # isort
]
fixable = ["ALL"]

[tool.pytest.ini_options]
addopts = "-vra --dc=Test"
DJANGO_SETTINGS_MODULE = "georama.settings"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
