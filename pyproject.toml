[project]
name = "georama"
version = "0.1.0"
description = "Scalable Web Publishing for QGIS"
readme = "README.md"
authors = [
    { name = "OPENGIS.ch", email = "info@opengis.ch" }
]
maintainers = [
    { name = "OPENGIS.ch", email = "info@opengis.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "django[argon2]>=6.0.6",
    "django-configurations>=2.5.1",
    "django-cors-headers>=4.9.0",
    "django-filter>=25.2",
    "django-guardian>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "django-unfold>=0.96.0",
    "django-extensions>=4.1",
    "djangorestframework>=3.17.1",
    "drf-spectacular[sidecar]>=0.29.0",
    "djangorestframework-gis>=1.2.1",
    "django-allauth[socialaccount]>=65.18.0",
    "adrf>=0.1.13",
    "django-crispy-forms>=2.6",
    "crispy-bootstrap5>=2026.3",
    "pygeoapi==0.21.0",
    "qgis_server_light[dispatcher] @ git+https://github.com/opengisch/qgis-server-light.git@refactoring",
    "xsdata>=26.2",
    "sqlalchemy>=2.0.51",
    "geoalchemy2>=0.20.0",
    "psycopg2-binary>=2.9.12",
    "gdal==3.10.3",
    "httpx>=0.28.1",
    "servestatic[brotli]>=4.3.4",
]

[project.scripts]
manage = "georama.manage:main"
[project.urls]
Tracker = "https://github.com/georama/issues"
CI = "https://github.com/opengisch/georama/actions"
Documentation = "https://opengisch.github.io/georama"
Source = "https://github.com/opengisch/georama"
Contributing = "https://github.com/opengisch/georama/blob/master/CONTRIBUTING.md"
[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
prod = [
    "gunicorn==26.2.0",
    # https://github.com/Kludex/uvicorn/discussions/2798
    "uvicorn-worker>=0.4.0",
]

dev = [
    { include-group = "lint-format" },
    { include-group = "test" },
    "uvicorn>=0.49.0",
    "django-extensions>=4.1",
    "django-silk>=5.5.0",
    "factory-boy>=3.3.3",
    "pre-commit",
    "pyproj>=3.7.2",
    "shapely>=2.1.2",
    "ty>=0.0.56",
]
lint-format = [
    "ruff>=0.15.15",
]
test = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "pytest-lazy-fixtures>=1.4.0",
]
docs = [
    "zensical>=0.0.70",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "src/georama/maps/interfaces/**",
    "src/georama/*/migrations/**",
]
[tool.ruff.lint]
extend-select = [
    "I", # isort
    "B006", # Mutable argument default
    "BLE001", # Checks for except clauses that catch all exceptions, see https://docs.astral.sh/ruff/rules/blind-except/
    "UP035", # Checks for uses of deprecated imports based on the minimum supported Python version, see https://docs.astral.sh/ruff/rules/deprecated-import/
    "TID252", # Bans relative imports, requires absolute imports, see https://docs.astral.sh/ruff/rules/relative-imports/
    "TC", # Type checking rules, https://docs.astral.sh/ruff/rules/#flake8-type-checking-tc
    "N", # Naming rules, see https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "D", # Documentation rules, see https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "Q", # Quotes
    "UP", # pyupgrade replacement
    "B", # bugbear
    "SIM", # simplify
]
ignore = [
    # No need to force f-strings everywhere, something `"".format()` is more readable
    # See https://docs.astral.sh/ruff/rules/f-string/
    "UP032",
    # Django encourages `Value as V`, so don't flag it as an error
    # See https://docs.astral.sh/ruff/rules/camelcase-imported-as-acronym/
    "N817",
    # We do not require documentation by default
    "D10",
    # Multi-line summaries are common in this project
    # See https://docs.astral.sh/ruff/rules/missing-blank-line-after-summary/
    "D205",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# django-configurations exposes settings as uppercase properties
"src/georama/settings.py" = ["N802"]
# Fake data generation falls back to defaults on any failure
"src/georama/core/common/faker/**" = ["BLE001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "-vra --dc=Test"
DJANGO_SETTINGS_MODULE = "georama.settings"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
