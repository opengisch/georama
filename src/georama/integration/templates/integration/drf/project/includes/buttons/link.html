{% load static i18n %}

{% blocktranslate asvar title %}
    Integrate QGIS project in Georama by loading it from disk
{% endblocktranslate %}
<form action="{% url view.non_integrated_url_name %}" method="post">
    {% csrf_token %}
    <input name="path" value="{{ project_file.path_from_orga }}" hidden>
    <button type="submit"
            class="btn btn-outline-primary"
            role="button"
            title="{{ title }}"
            aria-label="{{ title }}"
            data-bs-toggle="tooltip">
        <i class="fa fa-link"></i>
    </button>
</form>
