{% extends 'admin/change_list.html' %}
{% load i18n admin_list %}
{% load static %}

{% block content %}
    <table class="table table-striped table-hover">
        <tbody>
        {% for ds in cl.result_list %}
            <tr class="even">
                <td class="align-middle" style="width: 150px;">
                    <a href="" class="dataset-icon img-thumbnail">
                        <i class="{{ ds.icon }}"></i>
                    </a>
                </td>
                <td class="align-middle">
                    <div class="d-flex flex-column">
                        <a href="">
                            <h4>{{ ds }}</h4>
                        </a>
                        <h6>{{ ds.name }}</h6>
                    </div>
                </td>
                <td class="align-middle">
                    <div class="btn-toolbar d-flex justify-content-end" role="toolbar" aria-label="Toolbar with button groups">

                        <div class="btn-group mr-2" role="group" aria-label="Third group">
                            <a href="{% url 'admin:data_integration_project_delete' ds.pk %}"
                               class="btn btn-danger"
                               data-toggle="tooltip" data-placement="top"
                               title="{% trans 'Delete project' %}">
                                <i class="fa fa-trash-alt"></i>
                            </a>
                        </div>
                    </div>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>

{% endblock %}
