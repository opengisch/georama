{% extends 'core/detail/../../../../core/templates/core/form.html' %}

{% block extra_head %}
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.7.0/dist/ol.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.7.0/ol.css">
{% endblock %}

{% block form %}
    <style>
        #map {
            height: 80vh;
            width: 100%;
        }
    </style>
    <div class="row g-2 mb-3">
        <div class="col-md-6">
            <input
                id="capabilitiesUrl"
                class="form-control"
                placeholder="WMTS GetCapabilities URL"
                value="https://wmts.geo.admin.ch/1.0.0/WMTSCapabilities.xml"
            >
        </div>
        <div class="col-md-2">
            <button id="loadBtn" class="btn btn-primary w-100">
                Laden
            </button>
        </div>
        <div class="col-md-4">
            <select id="layerSelect" class="form-select">
                <option>Keine Layer geladen</option>
            </select>
        </div>
        <div class="row mb-3">
            <div class="col-md-4 offset-md-8">
                <input
                    id="searchInput"
                    class="form-control"
                    placeholder="Layer suchen…"
                >
            </div>
        </div>
        <div id="map"></div>
    </div>
    <script>
    var RESOLUTIONS = [
        4000, 3750, 3500, 3250, 3000, 2750, 2500, 2250, 2000, 1750, 1500, 1250,
        1000, 750, 650, 500, 250, 100, 50, 20, 10, 5, 2.5, 2, 1.5, 1, 0.5
    ];
    var extent = [2420000, 130000, 2900000, 1350000];
    var projection = ol.proj.get('EPSG:2056');
    projection.setExtent(extent);


    var matrixIds = [];
    for (var i = 0; i < RESOLUTIONS.length; i++) {
      matrixIds.push(i);
    }
    const map = new ol.Map({
        target: 'map',
        view: new ol.View({
            center: ol.proj.fromLonLat([10, 51]),
            zoom: 5
        }),
        layers: []
    });

    let wmtsCapabilities;
    let currentLayer;
    let allLayers = [];

    const layerSelect = document.getElementById('layerSelect');
    const searchInput = document.getElementById('searchInput');

    document.getElementById('loadBtn').onclick = async () => {

        const url = document.getElementById('capabilitiesUrl').value;

        const response = await fetch(url);
        const text = await response.text();

        const parser = new ol.format.WMTSCapabilities();
        wmtsCapabilities = parser.read(text);

        allLayers = wmtsCapabilities.Contents.Layer.map(layer => ({
            id: layer.Identifier,
            title: layer.Title || layer.Identifier
        }));

        renderLayerList(allLayers);

        if (allLayers.length > 0) {
            loadLayer(allLayers[0].id);
        }
    };

    searchInput.oninput = () => {
        const value = searchInput.value.toLowerCase();

        const filtered = allLayers.filter(l =>
            l.id.toLowerCase().includes(value) ||
            l.title.toLowerCase().includes(value)
        );

        renderLayerList(filtered);
    };

    layerSelect.onchange = () => {
        loadLayer(layerSelect.value);
    };

    function renderLayerList(layers) {
        layerSelect.innerHTML = '';

        layers.forEach(l => {
            const opt = document.createElement('option');
            opt.value = l.id;
            opt.textContent = `${l.title} (${l.id})`;
            layerSelect.appendChild(opt);
        });
    }

    function loadLayer(layerName) {

        if (currentLayer) {
            map.removeLayer(currentLayer);
        }

        const options = ol.source.WMTS.optionsFromCapabilities(
            wmtsCapabilities,
            {
                layer: layerName,
                matrixSet: wmtsCapabilities.Contents.TileMatrixSet[0].Identifier
            }
        );

        currentLayer = new ol.layer.Tile({
            source: new ol.source.WMTS(options)
        });

        map.addLayer(currentLayer);
    }
</script>

{% endblock %}
