{% extends 'admin/base_site.html' %}

{% block content %}
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Title</th>
                <th>Project</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for dataset, url in vector_datasets %}
                <tr class="even" role="row">
                    <td>{{ dataset.name }}</td>
                    <td>{{ dataset.title }}</td>
                    <td>{{ dataset.project.name }}</td>
                    <td><a href="{{ url }}" class="btn btn-high btn-success">publish</a></td>
                </tr>

            {% endfor %}
        </tbody>
    </table>

{% endblock %}
