{% extends 'core/change_list.html' %}
{% load static %}

{% block list_actions %}
    <div class="btn-group" role="group" aria-label="Basic example">
        <a href="{% url 'features:collections' %}?f=json" target="_blank" class="btn btn-outline-primary">OGCAPI JSON</a>
    </div>
{% endblock %}

{% block change_list_item %}
    <div class="list-group-item list-group-item-action p-4" aria-current="true">

        <div class="d-flex flex-row">
                <div class="me-3">
                    <a href="#">
                    <img src="{% static 'images/qgis.png' %}"
{#                         alt="{% trans 'QGIS Logo' %}"#}
                         class="rounded img-thumbnail preview-image"/>
                    </a>
                </div>

                <div class="d-flex flex-column flex-grow-1 justify-content-around">

                    <div>
                        <a href="#">
                            <h4 class="mb-1">{{ item.title }}</h4>
                        </a>
                        <h6 class="mb-1">{{ item.name }}</h6>
                    </div>


                    <div class="align-content-bottom">
                        {% if item.public %}
                            <span class="badge rounded-pill text-bg-primary">public</span>
                        {% endif %}
                    </div>
                </div>

                <div class="align-content-center">
                    <div class="btn-group" role="group" aria-label="Basic example">
                        <a href="{% url 'features:collection-detail' item.pk %}" target="_blank"
                           class="btn btn-outline-primary" tabindex="-1" role="button" aria-disabled="true">Show</a>
                        <a href="{% url 'features:form_ogcapi-f' item.pk %}"
                           class="btn btn-outline-primary" tabindex="-1" role="button" aria-disabled="true">Details</a>
                    </div>
                </div>

        </div>

    </div>
{% endblock %}
