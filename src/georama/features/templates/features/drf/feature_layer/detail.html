{% extends 'core/drf/default/detail.html' %}
{% load i18n %}

{% block detail_extra_actions %}
    {% if can_change %}
        {% blocktranslate asvar title %}Edit Fieldvisibility{% endblocktranslate %}
        <a href="{% url view.url_name_fields object.pk %}"
           class="btn btn-outline-primary" role="button"
           data-bs-toggle="tooltip"
           title="{{ title }}"
           aria-label="{{ title }}">
            <i class="fa fa-list"></i>
        </a>
    {% endif %}
{% endblock %}
