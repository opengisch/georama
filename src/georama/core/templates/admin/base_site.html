{% extends "admin/base.html" %}
{% load static %}


{% block extrastyle %}
    {{ block.super }}
    <link href="https://viglino.github.io/font-gis/css/font-gis.css" rel="stylesheet" />
    <style>
        /* Vertically center content in all Django admin list view columns */
        .change-list table td,
        .change-list table th {
            vertical-align: middle;
        }
    </style>
{% endblock %}


{% block page_content %}
    <style>
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(72, 78, 101, 0.95);
            display: none;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        .modal-overlay video {
            width: 30%;
            margin-top: 10%;
        }
        .wait-message {
            color: rgb(27 32 51);
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
        }
    </style>

    <script>
        function showWaitModalOverlay() {
            document.getElementById('please-wait-modal-overlay').style.display = 'flex';
        }
    </script>
    <div id="please-wait-modal-overlay" class="modal-overlay">
        <video autoplay loop muted>
            <source src="{% static 'logo/please_wait.mp4' %}" type="video/mp4">
        </video>
        <div class="wait-message">Please wait...</div>
    </div>

    {{ block.super }}
{% endblock %}
