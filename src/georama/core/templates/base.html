{% load static %}

<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-theme-default="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#262626" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">

  <title>Georama – Your Geospatial Data Hub</title>
  <script src="{% static 'js/dark-mode-init.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/bootstrap.overwrites.css' %}">
  <link rel="stylesheet" href="{% static 'css/georama.css' %}">

  {% block extra_head %}{% endblock %}

</head>
<body>

{% block content %}
{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
  <script src="{% static 'js/dark-mode.js' %}"></script>
{% block extra_js %}{% endblock %}

</body>
</html>
