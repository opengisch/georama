{% extends 'core/home.html' %}

{% block content %}

    <div id="content">

        <main class="landing-page">
            <section class="section-block py-5">
                <div class="container">
                    <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                      <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{% url 'landing' %}">Home</a></li>
                        <li class="breadcrumb-item"><a href="{% url app_menu.url_name %}">{{ app_menu.label }}</a></li>
                        <li class="breadcrumb-item"><a href="{% url change_list_view_name %}">{{ change_list_page_title }}</a></li>
                        <li class="breadcrumb-item active" aria-current="page">{{ instance_title }}</li>
                      </ol>
                    </nav>
                </div>
                {% block form %}
                {% endblock %}
            </section>
        </main>
    </div>
{% endblock %}
