{% for obj in objects %}
    {% if obj|length > 0 %}
        <li class="list-group-item">
            <ul class="list-group list-group-flush ms-4 mt-2">
                {% include "core/drf/default/includes/nested_delete.html" with objects=obj %}
            </ul>
        </li>
    {% else %}
        <li class="list-group-item">{{ obj }}</li>
    {% endif %}
{% endfor %}
