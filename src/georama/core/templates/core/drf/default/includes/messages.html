<div id="messages"
     class="toast-container position-fixed bottom-0 end-0 p-3 pb-4 mb-5"
    {% if oob %}hx-swap-oob="true"{% endif %}>

    {% for message in messages %}
        <div
                class="toast align-items-center text-bg-{% if message.level_tag == 'error' %}danger{% else %}{{ message.tags }}{% endif %} border-0"
                role="alert"
                data-bs-delay="8000">

            <div class="d-flex">
                <div class="toast-body">
                    {{ message }}
                </div>

                <button
                        type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast">
                </button>
            </div>
        </div>
    {% endfor %}

</div>


<script>

    // Show messages on a regular full page load
    document.querySelectorAll(".toast").forEach(el => {
        bootstrap.Toast.getOrCreateInstance(el).show();
    });

    // Show messages on a partial page load
    document.body.addEventListener("htmx:afterSwap", () => {
        document.querySelectorAll(".toast").forEach(el => {
            bootstrap.Toast.getOrCreateInstance(el).show();
        });
    });

</script>
