{% for obj in objects %}
    {% if obj.0 %}
        <li class="list-group-item">
            {{ obj.0 }}
            {% if obj.1 %}
                <ul class="list-group list-group-flush ms-4 mt-2">
                    {% include "core/includes/nested_delete.html" with objects=obj.1 %}
                </ul>
            {% endif %}
        </li>
    {% else %}
        <li class="list-group-item">{{ obj }}</li>
    {% endif %}
{% endfor %}
