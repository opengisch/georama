{% load i18n %}
{% with url=layer.endpoint_url_wms %}
    {% if url %}
        {% blocktranslate asvar title %}
            Open layer as WMS
        {% endblocktranslate %}
        <a href="{{ url }}"
           target="_blank"
           rel="noopener"
           class="btn btn-outline-primary"
           role="button"
           title="{{ title }}"
           aria-label="{{ title }}"
           data-bs-toggle="tooltip">
            <i class="fa fa-arrow-up-right-from-square"></i>
        </a>
    {% endif %}
{% endwith %}
