
                        <div class="row">
                            <div class="card">
                                <div class="card-body">
                                    <table class="table table-striped">
                                        <thead>
                                            <tr>
                                                <th>Name</th>
                                                <th>Title</th>
                                                <th>Project</th>
                                                <th>Mandant</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {% for dataset in datasets %}
                                                <tr class="even" role="row">
                                                    <td>{{ dataset.name }}</td>
                                                    <td>{{ dataset.title }}</td>
                                                    <td>{{ dataset.project.name }}</td>
                                                    <td>{{ dataset.project.mandant.name }}</td>
                                                    <td>
                                                        <a href="{% url publish_view_name model dataset.pk %}?next={% url 'admin:maps_publishedaswms_changelist' %}" class="btn btn-high btn-success">publish</a>
                                                    </td>
                                                </tr>
                                            {% endfor %}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
