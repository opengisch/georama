repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # keep in sync with the ruff version in uv.lock
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: forgotten-migrations
        name: Django migrations not applied
        entry: docker compose -f compose.yml -f compose.dev.yml run --rm --remove-orphans --entrypoint bash georama -c "uv run manage makemigrations --check --dry-run"
        language: system
        pass_filenames: false
        types: [ python ]
