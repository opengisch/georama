name: MissingDjangoMigrations
on:
  push:
    branches:
    pull_requests:

jobs:
  test-migrations:
    name: Test no migrations were left behind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: pre-commit/action@v3.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: actions/checkout@v6
      - name: Prepare Build Environment
        run: |
          cp .env.dev .env
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
          echo "QSL_SOURCE_BRANCH=master" >> .env
          cat .env
      - name: Build Georama Image
        run: |
          docker compose build georama
      - name: Start Docker composition
        run: |
          docker compose up -d
      - name: Check migrations
        env:
          DJANGO_CONFIGURATION: Dev
        run: docker compose run --rm --entrypoint bash georama -c "uv run manage makemigrations --check --dry-run"
