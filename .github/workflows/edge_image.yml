name: Build Edge Image

on:
  # a merged pull request ends in a push to main, so this covers merges too
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-edge
  cancel-in-progress: true

jobs:
  docker-image-edge:
    runs-on: ubuntu-latest
    # manual runs from other branches must not overwrite the edge tag
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Point QSL to main
        # not committed, edge follows QSL main, the release pin in pyproject.toml stays
        # for releases and PR images
        # the image installs from uv.lock (uv sync --frozen), so uv add rewrites both
        run: |
          uv add --no-sync --raw "qgis_server_light[dispatcher] @ git+https://github.com/opengisch/qgis-server-light.git@main"
          grep -n "qgis-server-light.git" uv.lock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Edge Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:edge
          # the SBOM (BuildKit scanner, based on syft) is attached to the image as
          # an attestation
          sbom: true
