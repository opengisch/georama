name: QSLReleaseGate
on:
  # no paths filter: a required check skipped by a paths filter stays pending forever
  pull_request:
    branches:
      - main
    # a draft may pin a QSL PR, so the check re-runs when the draft state changes
    types: [ opened, reopened, synchronize, ready_for_review, converted_to_draft ]
permissions:
  contents: read
jobs:
  # a georama PR may run on a QSL PR as a draft, it is ready only once that QSL change is released and pinned
  qsl-release:
    name: QSL pin is a release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the QSL pin is a release
        run: python3 .github/scripts/qsl_pin.py ${{ !github.event.pull_request.draft && '--require-release' || '' }}
