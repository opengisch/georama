name: QSLReleaseGate
on:
  # no paths filter: a required check skipped by a paths filter stays pending forever
  pull_request:
    branches:
      - main
    types: [ opened, reopened, synchronize ]
permissions:
  contents: read
jobs:
  # a georama PR may run on a QSL PR, it reaches main only once that QSL change is released and pinned
  qsl-release:
    name: QSL pin is a release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the QSL pin is a release
        run: python3 .github/scripts/qsl_pin.py --require-release
