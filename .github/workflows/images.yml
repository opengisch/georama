name: Build Docker Images

on:
  push:
    branches:
      - master
  release:
    types: [published]
  pull_request:
    branches:
      - master
    types: [opened, synchronize, closed]

permissions:
  contents: read
  packages: write
  
jobs:
  docker-image-latest:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      matrix:
        include:
          - target: dev
            label: latest-dev
          - target: prod
            label: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build latest (${{ matrix.target }})
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: ${{ matrix.target }}
          cache-from: type=local,src=cache
          tags: ghcr.io/${{ github.repository }}:${{ matrix.label }}

  docker-image-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern=v{{major}},value=${{ github.event.release.tag_name }}

      - name: Build release (${{ github.event.release.tag_name }})
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: prod
          cache-from: type=local,src=cache
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  ghcr-pr-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # dependabot has no rights to push pr image.
      # we want the pipeline to signal red on build failure still,
      # but not on push failure
      - name: Build PR Image
        if: github.event.action != 'closed'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}

      - name: Build PR Image
        if: github.event.action != 'closed'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}

      - name: Delete PR image
        if: github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: pr-${{ github.event.pull_request.number }}
          PACKAGE: georama-release-fork
        run: |
          ID=$(gh api \
            "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE/versions" \
            --paginate \
            --jq ".[] | select(.metadata.container.tags | index(\"$TAG\")) | .id")
      
          if [ -n "$ID" ]; then
            echo "Deleting package version $ID for tag $TAG"
      
            gh api \
              --method DELETE \
              "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE/versions/$ID"
          else
            echo "No package version found for tag $TAG"
          fi
