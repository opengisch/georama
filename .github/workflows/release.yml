name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      final: ${{ steps.final.outputs.final }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not reachable from main, releases are cut from main only"
            exit 1
          fi
      - name: Check tag is a final release
        id: final
        # v26.0 or v26.0.1 move latest, pre-releases like v26.0-beta.1 do not
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "final=true" >> "${GITHUB_OUTPUT}"
          else
            echo "final=false" >> "${GITHUB_OUTPUT}"
          fi


  test:
    needs: check
    uses: ./.github/workflows/test.yaml

  migrations:
    needs: check
    uses: ./.github/workflows/migrations.yaml

  # a release never states a QSL pin that isn't consistent
  qsl-version:
    needs: check
    uses: ./.github/workflows/qsl-version.yaml

  docker-image-release:
    runs-on: ubuntu-latest
    needs: [ check, test, migrations, qsl-version ]
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set package version from tag
        # not committed, the version in pyproject.toml stays a placeholder
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version for image tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Build Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}

      # pre-releases (v26.0-beta.1) do not move latest
      - name: Tag Image as latest
        if: needs.check.outputs.final == 'true'
        run: >-
          docker buildx imagetools create
          --tag ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}

  github-release:
    runs-on: ubuntu-latest
    needs: [ check, docker-image-release, qsl-version ]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Write QGIS-Server-Light compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          QSL_VERSION: ${{ needs.qsl-version.outputs.version }}
        # answers "which QSL do I run with this georama", links every QSL release skipped on the way
        run: |
          qsl_releases="https://github.com/opengisch/qgis-server-light/releases/tag"
          {
            echo "## QGIS-Server-Light"
            echo
            echo "Runs with QSL [${QSL_VERSION}](${qsl_releases}/${QSL_VERSION}):"
            echo "- \`opengisch/qgis-server-light:${QSL_VERSION#v}-worker\`"
            echo "- \`opengisch/qgis-server-light:${QSL_VERSION#v}-exporter\`"
            echo
          } > qsl-compatibility.md

          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          previous_pin=""
          if [ -n "${previous}" ]; then
            previous_pin=$(git show "${previous}:pyproject.toml" | grep -oP 'qgis-server-light\.git@\Kv[^"]+' || true)
          fi
          if [ -n "${previous_pin}" ] && [ "${previous_pin}" != "${QSL_VERSION}" ]; then
            # QSL releases after the previous pin up to the new one, version ordered
            skipped=$(gh release list --repo opengisch/qgis-server-light --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
              | sort -V \
              | awk -v from="${previous_pin}" -v to="${QSL_VERSION}" '$0 == from { after = 1; next } after { print } $0 == to { exit }' \
              | sed "s|.*|[&](${qsl_releases}/&)|" \
              | paste -sd ',' - | sed 's/,/, /g')
            echo "QSL changed since georama ${previous} (QSL ${previous_pin}): ${skipped}." >> qsl-compatibility.md
            echo >> qsl-compatibility.md
          fi
          cat qsl-compatibility.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # notes: the QSL compatibility first, then the PRs merged since the previous tag, grouped by .github/release.yml
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file qsl-compatibility.md --generate-notes --verify-tag --prerelease=${{ needs.check.outputs.final != 'true' }}
