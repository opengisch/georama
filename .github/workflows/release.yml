name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      final: ${{ steps.final.outputs.final }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not reachable from main, releases are cut from main only"
            exit 1
          fi
      - name: Check tag is a final release
        id: final
        # v26.0 or v26.0.1 move latest, pre-releases like v26.0-beta.1 do not
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "final=true" >> "${GITHUB_OUTPUT}"
          else
            echo "final=false" >> "${GITHUB_OUTPUT}"
          fi


  test:
    needs: check
    uses: ./.github/workflows/test.yaml

  migrations:
    needs: check
    uses: ./.github/workflows/migrations.yaml

  # a release never states a QSL pin that isn't consistent or isn't a QSL release
  qsl-version:
    needs: check
    uses: ./.github/workflows/qsl-version.yaml
    with:
      require-release: true

  docker-image-release:
    runs-on: ubuntu-latest
    needs: [ check, test, migrations, qsl-version ]
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set package version from tag
        # not committed, the version in pyproject.toml stays a placeholder
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version for image tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Build Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          # the SBOM (BuildKit scanner, based on syft) is attached to the image as
          # an attestation, the github release takes it over as asset
          sbom: true

      # pre-releases (v26.0-beta.1) do not move latest
      - name: Tag Image as latest
        if: needs.check.outputs.final == 'true'
        run: >-
          docker buildx imagetools create
          --tag ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}

  github-release:
    runs-on: ubuntu-latest
    needs: [ check, docker-image-release, qsl-version ]
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract SBOM of the released image
        # the very SBOM attested to the image, so the asset and the image never differ
        run: >-
          docker buildx imagetools inspect
          "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}"
          --format '{{ json .SBOM.SPDX }}'
          > "georama-${GITHUB_REF_NAME}.spdx.json"

      - name: Write QGIS-Server-Light compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        # answers "which QSL do I run with this georama", links every QSL release skipped on the way
        run: python3 .github/scripts/qsl_release_note.py --tag "${GITHUB_REF_NAME}" --output qsl-compatibility.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # notes: the QSL compatibility first, then the PRs merged since the previous tag, grouped by .github/release.yml
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file qsl-compatibility.md --generate-notes --verify-tag --prerelease=${{ needs.check.outputs.final != 'true' }} "georama-${GITHUB_REF_NAME}.spdx.json"
