name: Build Docker Images for PullRequests

on:
  pull_request:
    branches:
      - main
    types: [ opened, reopened, synchronize, closed ]

permissions:
  contents: read
  packages: write
  pull-requests: write
  security-events: write

concurrency:
  group: image-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  docker-image-pr:
    runs-on: ubuntu-latest
    env:
      # fork PRs have no access to secrets, they are built but not pushed
      PUSH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event.action != 'closed' && env.PUSH == 'true' && github.actor != 'dependabot[bot]'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PR Image
        if: github.event.action != 'closed'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          build-args: &build-args |
            BUILD_BRANCH=${{ github.head_ref || github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=pr${{ github.event.pull_request.number }}
          cache-to: type=gha,mode=max,scope=pr${{ github.event.pull_request.number }}

      # scanned once into json, sarif and the PR report are converted from it
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: github.event.action != 'closed'
        with:
          image-ref: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          format: json
          output: trivy-georama-image.json
          severity: CRITICAL,HIGH
          exit-code: 0

      # trivy-action put the trivy binary on the PATH, the markdown report lands
      # in the job summary for every PR, forks and dependabot included
      - name: Convert Trivy results
        if: >-
          !cancelled()
          && github.event.action != 'closed'
          && hashFiles('trivy-georama-image.json') != ''
        env:
          # read by the template
          REPORT: trivy-georama-image
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trivy convert --quiet --format sarif --output "$REPORT.sarif" "$REPORT.json"
          trivy convert --quiet --format template --template "@.github/trivy-report.md.tpl" \
            --output "$REPORT.md" "$REPORT.json"
          cat "$REPORT.md" >> "${GITHUB_STEP_SUMMARY}"

      # one comment per image, found by its marker and updated on every push,
      # dependabot or fork PRs have readonly tokens, so we prevent comments
      - name: Comment Trivy results on PR
        if: >-
          !cancelled()
          && env.PUSH == 'true'
          && github.actor != 'dependabot[bot]'
          && hashFiles('trivy-georama-image.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: trivy-georama-image
          COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
        run: |
          COMMENT_ID=$(gh api "$COMMENTS" --paginate \
            --jq ".[] | select(.body | startswith(\"<!-- $REPORT -->\")) | .id" | head -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
              -F body=@"$REPORT.md"
          else
            gh api --method POST "$COMMENTS" -F body=@"$REPORT.md"
          fi

      - name: Upload Trivy results
        # dependebot or fork PRs have readonly tokens, so we prevent uploads
        if: >-
          !cancelled()
          && env.PUSH == 'true'
          && github.actor != 'dependabot[bot]'
          && hashFiles('trivy-georama-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-georama-image.sarif
          category: trivy-georama

      # dependabot has no rights to push pr image,
      # its PRs are built only (see step above)
      - name: Push PR Image
        if: github.event.action != 'closed' && env.PUSH == 'true' && github.actor != 'dependabot[bot]'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: *build-args
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}

      # prod plus the ops tooling for emergencies, pushed under the same rules as the PR image
      - name: Push PR sam Image
        if: github.event.action != 'closed' && env.PUSH == 'true' && github.actor != 'dependabot[bot]'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: sam
          push: true
          build-args: *build-args
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}-sam

      - name: Delete PR images
        if: github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TAG: pr-${{ github.event.pull_request.number }}
          PACKAGE: georama
        run: |
          for TAG in "$PR_TAG" "$PR_TAG-sam"; do
            ID=$(gh api \
              "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE/versions" \
              --paginate \
              --jq ".[] | select(.metadata.container.tags | index(\"$TAG\")) | .id")

            if [ -n "$ID" ]; then
              echo "Deleting package version $ID for tag $TAG"

              gh api \
                --method DELETE \
                "/orgs/${{ github.repository_owner }}/packages/container/$PACKAGE/versions/$ID"
            else
              echo "No package version found for tag $TAG"
            fi
          done