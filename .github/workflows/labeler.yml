name: Label PR

on:
  # runs from the base branch, labels fork PRs too, PR code is not checked out
  pull_request_target:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label changes
        uses: actions/labeler@v7
        with:
          sync-labels: true
