name: Linting/Formatting
on: push
env:
  UV_PYTHON: /usr/local/bin/python
jobs:
  lint-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare Build Environment
        run: |
          cp .env.dev .env
          echo "UID=$(id -u)" > .env
          echo "GID=$(id -g)" > .env
          cat .env
      - name: Build Georama Image
        run: |
          docker compose build georama
      - name: Start Docker composition
        run: |
          docker compose up -d
      - name: Run Ruff
        run: docker compose exec georama uv run ruff check --output-format=github .