name: Build docs

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master


jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TX_TOKEN: ${{ secrets.TX_TOKEN }}
    steps:
      - run: sudo rm /etc/apt/sources.list.d/*.list
      - run: sudo apt update
      - run: sudo apt-get install -y python3-venv python3-dev unixodbc odbc-mdbtools gdal-bin libgdal-dev libpq-dev build-essential make git curl
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python requirements
        run: make install-docs

      - name: Build Docs
        run: make doc-html

      - name: Zip the site
        run: |
          cd docs/site
          zip -r ../docs.zip .

      - name: Upload docs YIP
        uses: actions/upload-artifact@v7
        with:
          name: docs-zip
          path: docs/docs.zip

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/site
          if-no-files-found: error

# We disable that currently, since we deploy docs manually to docs.georama.io
