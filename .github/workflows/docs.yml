name: Documentation
on:
  push:
    branches:
      - zensical-doc
      - refactoring
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --frozen --only-group docs zensical build --clean
        working-directory: docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - uses: actions/deploy-pages@v5
        id: deployment
