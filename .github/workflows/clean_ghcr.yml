name: Cleanup Docker Images

on:
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  packages: write

concurrency:
  group: cleanup-images

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          dry-run: true
          validate: true
