name: TestSuite
on:
  push:
    branches:
      - "*"
    tags:
      - v*
jobs:
  test-py:
    name: Test Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version:
          - '3.12'
          - '3.13'
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Build Environment
        run: |
          cp .env.example .env
          echo "COMPOSE_FILE=compose.yml:compose.dev.yml" >> .env
          echo "PYTHON_VERSION=${{ matrix.python-version }}" >> .env
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
          cat .env
      - name: Build Georama Image
        run: |
          docker compose build georama
      - name: Start database and redis
        run: docker compose up -d --wait georama-db qsl-redis
      - name: Run tests
        run: docker compose run --rm --no-deps georama uv run pytest --cov
