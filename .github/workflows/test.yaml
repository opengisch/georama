name: TestSuite
on:
  push:
    branches:
      - "*"
    tags:
      - v*
jobs:
  test-py:
    name: Test Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version:
          - '3.12'
          - '3.13'
    steps:
      - uses: actions/checkout@v6
      - name: Prepare Build Environment
        run: |
          cp .env.dev .env
          echo "PY_VERSION=${{ matrix.python-version }}" > .env
          echo "UID=$(id -u)" > .env
          echo "GID=$(id -g)" > .env
          cat .env
      - name: Build Georama Image
        run: |
          docker compose build georama
      - name: Start Docker composition
        run: |
          docker compose up -d
      - name: Run tests
        run: docker compose exec georama uv run pytest
