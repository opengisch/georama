name: TestSuite
on:
  push:
    branches:
      - "*"
    tags:
      - v*
env:
  GEORAMA_DB_NAME: "test"
  GEORAMA_DB_USER: "postgres"
  GEORAMA_DB_PW: "test"
  GEORAMA_DB_HOST: "localhost"
  GEORAMA_DB_PORT: "5432"
  GEORAMA_DB_OPTIONS: "{}"
jobs:
  test-py:
    name: Test Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version:
          - '3.12'
          - '3.13'
    steps:
      - uses: actions/checkout@v6
      - name: Prepare Build Environment
        run: |
          cp .env.dev .env
          echo "${{ matrix.python-version }}" > .env
      - name: Build Georama Image
        run: |
          docker compose build georama
      - name: Start Docker composition
        run: |
          docker compose up -d
      - name: Run tests
        run: docker compose exec georama uv run pytest
