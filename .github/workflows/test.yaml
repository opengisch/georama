name: CI/CD Pipeline
on:
  push:
    branches:
      - "*"
    tags:
      - v*

jobs:

  gitattributes:
    name: Check style (git-attributes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo rm /etc/apt/sources.list.d/*.list
      - name: Run make git-attributes
        run: make git-attributes

  # TODO: Add linting here when we decided what approach we go for.

  test-py:
    name: Test Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python v${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - run: sudo rm /etc/apt/sources.list.d/*.list
      - run: sudo apt update
      - run: sudo apt-get install -y python3-venv python3-dev unixodbc odbc-mdbtools gdal-bin libgdal-dev libpq-dev build-essential make git curl
      - name: Start services
        run: docker compose up -d --wait georama-db qsl-exporter
      - name: Set up test environment
        run: make install-test
      - name: Run migration checks
        run: make check-migrations
      - name: Run tests for Python ${{ matrix.python-version }}
        run: DJANGO_CONFIGURATION=Test make tests
      - name: Test Coverage
        shell: bash
        run: |
          make coverage
          cp .coverage.xml coverage-${{ matrix.python-version }}.xml
      - name: Stop services
        if: always()
        run: docker compose down
