version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python:uv"
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      #security updates are activated on repo settings
      semver-patch-days: 3
    ignore:
      # Python bindings are compiled against the libgdal-dev installed by apt in
      # the Dockerfile: to be bumped manually.
      - dependency-name: "gdal"
      # Must stay aligned with the opengisch/qgis-server-light images in compose.yml:
      # to be bumped manually.
      - dependency-name: "qgis-server-light"
      # We cant move simply since even minor updates break current configs and api
      - dependency-name: "pygeoapi"
    groups:
      python-dev:
        patterns:
          - "ruff"
          - "ty"
          - "pre-commit"
          - "pytest"
          - "pytest-*"
          - "factory-boy"
          - "django-silk"
          - "zensical"
          - "pyproj"
          - "shapely"
          - "uvicorn"
        update-types:
          - "minor"
          - "patch"
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dockerfile (FROM lines)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    cooldown:
      default-days: 5
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # compose.yml, compose.dev.yml, compose.dev_with_qsl.yml (service images)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: "local/*"
      # Must stay aligned with the qgis_server_light version in pyproject.toml:
      # to be bumped manually.
      - dependency-name: "opengisch/qgis-server-light"
      # A major upgrade requires a dump/restore of the database, which is not
      # tooled yet.
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "postgis/postgis"
        update-types:
          - "version-update:semver-major"
    groups:
      docker-compose-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github_actions"
    cooldown:
      default-days: 5
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pre-commit"
    cooldown:
      default-days: 3
    groups:
      pre-commit-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
