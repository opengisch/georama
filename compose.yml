services:
  georama:
    env_file:
      - .env
    environment:
      - "GEORAMA_QSL_EXPORTER_URL=http://qsl-exporter:5000/export"
      - "QSL_REDIS_URL=redis://qsl-redis:6379"
    image: local/georama:dev
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        PYTHON_VERSION: "${PY_VERSION:-3.12}"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        QSL_SOURCE_BRANCH: "${QSL_SOURCE_BRANCH:-master}"
    develop:
      watch:
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: Dockerfile
    ports:
      - "127.0.0.1:4242:4242"
      - "127.0.0.1:4222:2222"
    volumes:
      - ./:/app
      - georama-venv:/.venv
      - georama-static:/georama/static
      - ssh_host_keys:/etc/ssh
      - ./docker/dev.sshd_config.conf:/etc/ssh/sshd_config
    depends_on:
      georama-db:
        condition: service_healthy
      qsl-redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
  georama-db:
    platform: "linux/amd64"
    restart: unless-stopped
    image: postgis/postgis:17-3.5
    volumes:
      - "georama-db:/var/lib/postgresql/data"
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - "POSTGRES_USER=${GEORAMA_DB_USER?}"
      - "POSTGRES_PASSWORD=${GEORAMA_DB_PW?}"
      - "POSTGRES_DB=${GEORAMA_DB_NAME?}"
    healthcheck:
      test: psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT PostGIS_Version()'
      interval: 0.1s
      timeout: 1s
      retries: 50
  qsl-redis:
    image: redis:8.8.0
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1s
      timeout: 0.5s
      retries: 50
  qsl:
    platform: "linux/amd64"
    restart: unless-stopped
    image: opengisch/qgis-server-light-dev:latest
    env_file:
      - .env
    environment:
      - "QSL_REDIS_URL=redis://qsl-redis:6379"
      - "QSL_SVG_PATH=/io/svg"
      - "QSL_DATA_ROOT=/io/data"
    volumes:
      - "./tests/resources/projects:/io/data:ro"
    deploy:
      replicas: 1
    depends_on:
      qsl-redis:
        condition: service_healthy
  qsl-exporter:
    platform: "linux/amd64"
    restart: unless-stopped
    image: opengisch/qgis-server-light-dev:latest
    env_file:
      - .env
    environment:
      - "QSL_DATA_ROOT=/io/data"
    ports:
      - "127.0.0.1:5000:5000"
    command:
      - "serve-exporter-api-outbound"
    volumes:
      - "./tests/resources/projects:/io/data"
  geogirafe:
    image: geogirafe/viewer:latest
    platform: "linux/amd64"
    restart: unless-stopped
    healthcheck:
      # override lighttpd's builtin healthcheck to prevent 1min startup delay
      # and traefik from masking misconfigurations with return code 404
      disable: true
    volumes:
      - ./geogirafe/config.json:/var/www/localhost/htdocs/config.json
      - ./geogirafe/config.mobile.json:/var/www/localhost/htdocs/config.mobile.json
    ports:
      - "127.0.0.1:9309:443"
      - "127.0.0.1:9308:80"

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 7080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_LOG_LEVEL: info
      KC_DB: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_URL: jdbc:postgresql://keycloak-db/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /etc/x509/https/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/x509/https/tls.key
      KC_HTTPS_KEY_STORE_FILE: /etc/x509/https/server.keystore
      KC_HTTPS_KEY_STORE_PASSWORD: changeit
      KC_HTTPS_KEY_STORE_TYPE: PKCS12
      KC_HTTPS_TRUST_STORE_FILE: /etc/x509/https/server.truststore
      KC_HTTPS_TRUST_STORE_PASSWORD: changeit
      KC_HTTPS_TRUST_STORE_TYPE: JKS
      KC_HTTPS_MANAGEMENT_CLIENT_AUTH: none
      X509_CA_BUNDLE: /etc/x509/https/rootCA.crt
    healthcheck:
      test: [
        "CMD-SHELL",
        "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n' >&3; if cat <&3 | grep -q UP; then exit 0; else exit 1; fi",
      ]
      interval: 15s
      timeout: 2s
      retries: 15
    restart: unless-stopped
    command: ["start-dev", "--http-port", "7080", "--https-port", "7443", "--import-realm"]
    ports:
      - "127.0.0.1:7080:7080"
      - "127.0.0.1:7443:7443"
    volumes:
      - ./keycloak/certs/keycloak.crt:/etc/x509/https/tls.crt
      - ./keycloak/certs/keycloak.key:/etc/x509/https/tls.key
      - ./keycloak/certs/rootCA.crt:/etc/x509/https/rootCA.crt
      - ./keycloak/certs/server.truststore:/etc/x509/https/server.truststore
      - ./keycloak/import:/opt/keycloak/data/import
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 2s
      retries: 5
    volumes:
      - keycloak-db:/var/lib/postgresql/data

volumes:
  georama-venv:
  georama-static:
  georama-db:
  keycloak-db:
  ssh_host_keys:
