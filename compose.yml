services:
  georama:
    init: true
    environment:
      - "GEORAMA_QSL_EXPORTER_URL=http://qsl-exporter:5000/export"
      - "QSL_REDIS_URL=redis://qsl-redis:6379"
      - "GEORAMA_WEBGISURL=https://localhost:9309"
      - "GEORAMA_OIDC_SERVER_URL=http://keycloak:7080/realms/ninjas/.well-known/openid-configuration"
      - "GEORAMA_DATA_INTEGRATION_ROOT=/io/data"
      - "GEORAMA_DB_NAME=${GEORAMA_DB_NAME?}"
      - "GEORAMA_DB_USER=${GEORAMA_DB_USER?}"
      - "GEORAMA_DB_PW=${GEORAMA_DB_PW?}"
      - "GEORAMA_DB_HOST=georama-db"
      - "GEORAMA_DB_PORT=5432"
      - "GEORAMA_DB_OPTIONS=${GEORAMA_DB_OPTIONS?}"
      - "DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY?}"
      - "DJANGO_CORS_ALLOWED_ORIGINS=${DJANGO_CORS_ALLOWED_ORIGINS?}"
      - "DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS?}"
      - "DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS?}"
      - "GEORAMA_ORGANISATION_DOMAIN=${GEORAMA_ORGANISATION_DOMAIN?}"
      - "GEORAMA_MAPS_OGC_OTHER_CRS=EPSG:3857 EPSG:4326 EPSG:2056"
      - "GEORAMA_WEBGIS_OGC_OTHER_CRS=EPSG:3857 EPSG:4326 EPSG:2056"
      - "DJANGO_CONFIGURATION=Prod"
      - "PGSERVICEFILE=/io/pg_service.conf"
    platform: "${PLATFORM:-linux/amd64}"
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4242:4242"
    volumes:
      - "${LOCAL_PROJECTS:-./tests/resources/projects}:/io/data"
      - "${PG_SERVICE_CONF:-./docker/pg_service.conf}:/io/pg_service.conf"
    depends_on:
      georama-db:
        condition: service_healthy
      qsl-redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
  georama-db:
    platform: "linux/amd64"
    restart: unless-stopped
    image: postgis/postgis:17-3.5
    volumes:
      - "georama-db:/var/lib/postgresql/data"
    environment:
      - "POSTGRES_USER=${GEORAMA_DB_USER?}"
      - "POSTGRES_PASSWORD=${GEORAMA_DB_PW?}"
      - "POSTGRES_DB=${GEORAMA_DB_NAME?}"
    healthcheck:
      test: psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT PostGIS_Version()'
      interval: 0.1s
      timeout: 1s
      retries: 50
  qsl-redis:
    platform: "${PLATFORM:-linux/amd64}"
    image: redis:8.8.0
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1s
      timeout: 0.5s
      retries: 50
  qsl-worker:
    platform: "${PLATFORM:-linux/amd64}"
    restart: unless-stopped
    image: opengisch/qgis-server-light:26.1-worker
    environment:
      - "QSL_REDIS_URL=redis://qsl-redis:6379"
      - "QSL_SVG_PATH=/io/svg"
      - "QSL_DATA_ROOT=/io/data"
      - "QSL_LOG_LEVEL=${QSL_WORKER_LOG_LEVEL:-info}"
      - "PGSERVICEFILE=/io/pg_service.conf"
    volumes:
      - "${LOCAL_PROJECTS:-./tests/resources/projects}:/io/data"
      - "${PG_SERVICE_CONF:-./docker/pg_service.conf}:/io/pg_service.conf"
    deploy:
      replicas: "${QSL_WORKER_REPLICAS:-4}"
    depends_on:
      qsl-redis:
        condition: service_healthy
  qsl-exporter:
    platform: "${PLATFORM:-linux/amd64}"
    restart: unless-stopped
    image: opengisch/qgis-server-light:26.1-exporter
    environment:
      - "QSL_DATA_ROOT=/io/data"
      - "QSL_EXPORTER_LOG_LEVEL=${QSL_LOG_LEVEL:-info}"
      - "PGSERVICEFILE=/io/pg_service.conf"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - "${LOCAL_PROJECTS:-./tests/resources/projects}:/io/data"
      - "${PG_SERVICE_CONF:-./docker/pg_service.conf}:/io/pg_service.conf"
  certs:
    # oneshot: creates or renews the dev certificates for keycloak and geogirafe and exits
    image: local/georama-certs:dev
    platform: "${PLATFORM:-linux/amd64}"
    build:
      dockerfile_inline: |
        FROM alpine:3
        RUN apk add --no-cache make openssl
    environment:
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
    command: [ "make", "--no-print-directory", "-C", "/cert_generation" ]
    restart: "no"
    volumes:
      - ./docker/cert_generation:/cert_generation:ro
      - ./.certs:/certs
      - dev-ca:/ca
  geogirafe:
    image: geogirafe/viewer:1.2.1
    platform: "${PLATFORM:-linux/amd64}"
    restart: unless-stopped
    healthcheck:
      # override lighttpd's builtin healthcheck to prevent 1min startup delay
      # and traefik from masking misconfigurations with return code 404
      disable: true
    volumes:
      - ./geogirafe/config.json:/var/www/localhost/htdocs/config.json:ro
      - ./geogirafe/config.mobile.json:/var/www/localhost/htdocs/config.mobile.json:ro
      # lighttpd reads localhost.pem from there, provided by the certs service
      - ./.certs:/etc/lighttpd/ssl:ro
    ports:
      - "127.0.0.1:9309:443"
    depends_on:
      certs:
        condition: service_completed_successfully

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    platform: "${PLATFORM:-linux/amd64}"
    environment:
      # browsers reach keycloak with https (geogirafe requires it), georama within the
      # docker network with http://keycloak:7080 (backchannel)
      KC_HOSTNAME: https://localhost:7443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_LOG_LEVEL: info
      KC_DB: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_URL: jdbc:postgresql://keycloak-db/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /etc/x509/https/localhost.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/x509/https/localhost.key
      KC_HTTPS_MANAGEMENT_CLIENT_AUTH: none
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n' >&3; if cat <&3 | grep -q UP; then exit 0; else exit 1; fi",
        ]
      interval: 15s
      timeout: 2s
      retries: 15
    restart: unless-stopped
    command:
      [
        "start-dev",
        "--http-port",
        "7080",
        "--https-port",
        "7443",
        "--import-realm",
      ]
    ports:
      - "127.0.0.1:7080:7080"
      - "127.0.0.1:7443:7443"
    volumes:
      # provided by the certs service
      - ./.certs:/etc/x509/https:ro
      - ./keycloak/import:/opt/keycloak/data/import
    depends_on:
      certs:
        condition: service_completed_successfully
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:14
    platform: "${PLATFORM:-linux/amd64}"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 10s
      timeout: 2s
      retries: 5
    volumes:
      - keycloak-db:/var/lib/postgresql/data
  gn:
    # based on https://github.com/geonetwork/docker-geonetwork/tree/main/4.4.12
    image: geonetwork:4.4.12
    platform: "${PLATFORM:-linux/amd64}"
    restart: unless-stopped
    environment:
      WEBAPP_CONTEXT_PATH: /geonetwork
      DATA_DIR: /catalogue-data
      GEONETWORK_DB_TYPE: postgres
      GEONETWORK_DB_HOST: gn-db
      GEONETWORK_DB_PORT: 5432
      GEONETWORK_DB_NAME: geonetwork
      GEONETWORK_DB_USERNAME: geonetwork
      GEONETWORK_DB_PASSWORD: geonetwork
      GN_CONFIG_PROPERTIES: >-
        -Dgeonetwork.dir=/catalogue-data
        -Dgeonetwork.formatter.dir=/catalogue-data/data/formatter
        -Dgeonetwork.schema.dir=/opt/geonetwork/WEB-INF/data/config/schema_plugins
        -Dgeonetwork.indexConfig.dir=/opt/geonetwork/WEB-INF/data/config/index
        -Dgeonetwork.schemapublication.dir=/opt/geonetwork/WEB-INF/data/resources/schemapublication
        -Dgeonetwork.htmlcache.dir=/opt/geonetwork/WEB-INF/data/resources/htmlcache
        -Des.host=gn-elasticsearch
        -Des.protocol=http
        -Des.port=9200
        -Des.url=http://gn-elasticsearch:9200
        -Des.username=
        -Des.password=
        -Dkb.url=http://gn-kibana:5601
        -Dgeonetwork.ESFeaturesProxy.targetUri=http://gn-elasticsearch:9200/gn-features/{_}
        -Dgeonetwork.HttpDashboardProxy.targetUri=http://gn-kibana:5601
        -Dgeonetwork.security.type=openidconnect
      # users log in through keycloak, same pattern as georama: browsers reach keycloak
      # with https://localhost:7443, geonetwork within the docker network with
      # http://keycloak:7080 (backchannel). The metadata is fetched once on startup.
      OPENIDCONNECT_SERVERMETADATA_CONFIG_URL: http://keycloak:7080/realms/ninjas/.well-known/openid-configuration
      # has to match the geonetwork-oidc client in keycloak/import/ninjas-realm.json
      OPENIDCONNECT_CLIENTID: geonetwork-oidc
      OPENIDCONNECT_CLIENTSECRET: geonetwork-dev-secret
      # roles are read from the id token, a role is either a geonetwork profile
      # (e.g. Administrator) or {group}:{profile} (e.g. sample:Editor)
      OPENIDCONNECT_IDTOKENROLELOCATION: resource_access.geonetwork-oidc.roles
      OPENIDCONNECT_USERNAME_ATTRIBUTE: preferred_username
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs -o /dev/null http://localhost:8080/geonetwork/srv/api/site" ]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - gn-data:/catalogue-data
    depends_on:
      gn-db:
        condition: service_healthy
      gn-elasticsearch:
        condition: service_healthy
      keycloak:
        condition: service_healthy
  gn-db:
    image: postgis/postgis:17-3.5
    platform: "${PLATFORM:-linux/amd64}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: geonetwork
      POSTGRES_USER: geonetwork
      POSTGRES_PASSWORD: geonetwork
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U geonetwork -d geonetwork" ]
      interval: 5s
      timeout: 2s
      retries: 10
    volumes:
      - gn-db:/var/lib/postgresql/data
  gn-elasticsearch:
    # search index of geonetwork, internal only (no record permissions in elasticsearch)
    image: elasticsearch:8.19.23
    platform: "${PLATFORM:-linux/amd64}"
    restart: unless-stopped
    environment:
      - "cluster.name=gn-cluster"
      - "discovery.type=single-node"
      - "bootstrap.memory_lock=true"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "xpack.security.enabled=false"
      - "xpack.security.enrollment.enabled=false"
      # dev only: above 90% host disk usage (high watermark) no shards are allocated,
      # geonetwork then times out creating its indices on startup
      - "cluster.routing.allocation.disk.threshold_enabled=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs -o /dev/null http://localhost:9200" ]
      interval: 10s
      timeout: 2s
      retries: 10
    volumes:
      - gn-esdata:/usr/share/elasticsearch/data
  gn-kibana:
    # geonetwork admin dashboards, reached through geonetwork at /geonetwork/dashboards
    image: kibana:8.19.23
    platform: "${PLATFORM:-linux/amd64}"
    restart: unless-stopped
    environment:
      SERVER_NAME: gn-kibana
      ELASTICSEARCH_HOSTS: http://gn-elasticsearch:9200
      SERVER_BASEPATH: /geonetwork/dashboards
      SERVER_REWRITEBASEPATH: "false"
    depends_on:
      gn-elasticsearch:
        condition: service_healthy

volumes:
  georama-db:
  keycloak-db:
  dev-ca:
  ssh_host_keys:
  gn-data:
  gn-db:
  gn-esdata:
