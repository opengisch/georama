services:
  georama:
    env_file:
      - .env
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        PYTHON_VERSION: "${PY_VERSION:-3.12}"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    develop:
      watch:
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: Dockerfile
    entrypoint: [ "/app/docker/dev.entrypoint.sh" ]
    ports:
      - "4242:4242"
    volumes:
      - ./:/app
      - georama-venv:/.venv
      - georama-static:/georama/static
    depends_on:
      georama-db:
        condition: service_healthy

  georama-db:
    platform: "${GEORAMA_PG_PLATFORM:-linux/amd64}"
    image: postgis/postgis:17-3.5
    volumes:
      - "georama-db:/var/lib/postgresql/data"
    ports:
      - "5433:5432"
    environment:
      - "POSTGRES_USER=${GEORAMA_DB_USER?}"
      - "POSTGRES_PASSWORD=${GEORAMA_DB_PW?}"
      - "POSTGRES_DB=${GEORAMA_DB_NAME?}"
    healthcheck:
      test: psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT PostGIS_Version()'
      interval: 0.1s
      timeout: 1s
      retries: 50
volumes:
  georama-venv:
  georama-static:
  georama-db:
