services:
  georama:
    image: georama:dev
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./:/app
      - "${GEORAMA_LOCAL_DATA}:/io/data"
    ports:
      - "8081:8000"
  georama-db:
    image: postgis/postgis:14-3.4
    volumes:
      - "georama-db_data:/var/lib/postgresql/data"
    ports:
      - "54321:5432"
    environment:
      - "POSTGRES_USER=${GEORAMA_DB_USER}"
      - "POSTGRES_PASSWORD=${GEORAMA_DB_PW}"
      - "POSTGRES_DB=${GEORAMA_DB_NAME}"
  georama-test_data:
    image: postgis/postgis:14-3.4
    volumes:
      - "georama-test_data:/var/lib/postgresql/data"
    ports:
      - "54322:5432"
    environment:
      - "POSTGRES_USER=${GEORAMA_DB_USER}"
      - "POSTGRES_PASSWORD=${GEORAMA_DB_PW}"
      - "POSTGRES_DB=${GEORAMA_DB_NAME}"
  qsl-redis:
    image: redis:7.4.0
  qsl:
    restart: unless-stopped
    image: ghcr.io/opengisch/qgis-server-light:latest
    env_file:
      - .env
    volumes:
      - "${GEORAMA_LOCAL_DATA}:/io/data"
    deploy:
      replicas: 1
  geogirafe:
    image: geogirafe/viewer:latest
    volumes:
      - ./geogirafe/config.json:/var/www/localhost/htdocs/config.json
    ports:
      - "8443:443"


  nginx:
    build:
      context: ./docker-nginx
    restart: unless-stopped
    volumes:
      - ./conf/certbot/conf:/etc/letsencrypt:ro
      - ./conf/nginx/certs/:/etc/nginx/certs/:ro
      - ./conf/nginx/config.d:/etc/nginx/config.d/:ro
      - ./conf/nginx/dhparams:/etc/nginx/dhparams/:ro
      - certbot_www:/var/www/certbot
    ports:
      - ${WEB_HTTP_PORT}:80
      - ${WEB_HTTPS_PORT}:443
    environment:
      GEORAMA_HOST: ${GEORAMA_HOST}
      GEORAMA_TLS_CERT: ${GEORAMA_TLS_CERT}
      GEORAMA_TLS_KEY: ${GEORAMA_TLS_KEY}
      GEORAMA_TLS_DHPARAMS: ${GEORAMA_TLS_DHPARAMS}
      WEB_HTTP_PORT: ${WEB_HTTP_PORT}
      WEB_HTTPS_PORT: ${WEB_HTTPS_PORT}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING}
      LETSENCRYPT_RSA_KEY_SIZE: ${LETSENCRYPT_RSA_KEY_SIZE}
      NGINX_ERROR_LOG_LEVEL: ${NGINX_ERROR_LOG_LEVEL:-error}
    logging:
      driver: "json-file"
      options:
        max-size: "1000m"
        max-file: "10"
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  # Automatically create self-signed certificates for local development and test deployments
  mkcert:
    image: vishnunair/docker-mkcert
    environment:
      domain: ${GEORAMA_HOST}
    volumes:
      - ./conf/nginx/certs/:/root/.local/share/mkcert/
    command: /bin/sh -c 'mkcert -install && for i in $$(echo $$domain | sed "s/,/ /g"); do [ ! -f /root/.local/share/mkcert/$$i.pem ] && mkcert $$i; done && tail -f -n0 /etc/hosts'

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./conf/certbot/conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"


volumes:
  georama-db_data:
  georama-test_data:
  certbot_www:

