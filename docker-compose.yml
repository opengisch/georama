services:
  georama:
    image: georama:dev
    build:
      context: .
      target: dev
    env_file:
      - .env
    volumes:
      - ./:/app
      - "${GEORAMA_LOCAL_DATA}:/io/data"
    ports:
      - "4242:4242"
  georama-db:
    image: postgis/postgis:14-3.4
    volumes:
      - "georama-db_data:/var/lib/postgresql/data"
    ports:
      - "54321:5432"
    environment:
      - "POSTGRES_USER=${GEORAMA_DB_USER}"
      - "POSTGRES_PASSWORD=${GEORAMA_DB_PW}"
      - "POSTGRES_DB=${GEORAMA_DB_NAME}"
  georama-test_data:
    image: postgis/postgis:14-3.4
    volumes:
      - "georama-test_data:/var/lib/postgresql/data"
    ports:
      - "54322:5432"
    environment:
      - "POSTGRES_USER=${GEORAMA_DB_USER}"
      - "POSTGRES_PASSWORD=${GEORAMA_DB_PW}"
      - "POSTGRES_DB=${GEORAMA_DB_NAME}"
  qsl-redis:
    image: redis:7.4.0
  qsl:
    restart: unless-stopped
    image: ghcr.io/opengisch/qgis-server-light:latest
    env_file:
      - .env
    volumes:
      - "${GEORAMA_LOCAL_DATA}:/io/data"
    deploy:
      replicas: 1
  geogirafe:
    image: geogirafe/viewer:latest
    volumes:
      - ./geogirafe/config.json:/var/www/localhost/htdocs/config.json
    ports:
      - "9309:443"
      - "9308:80"
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 7080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
      KC_DB: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_URL: jdbc:postgresql://keycloak-db/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /etc/x509/https/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/x509/https/tls.key
      KC_HTTPS_KEY_STORE_FILE: /etc/x509/https/server.keystore
      KC_HTTPS_KEY_STORE_PASSWORD: changeit
      KC_HTTPS_KEY_STORE_TYPE: PKCS12
      KC_HTTPS_TRUST_STORE_FILE: /etc/x509/https/server.truststore
      KC_HTTPS_TRUST_STORE_PASSWORD: changeit
      KC_HTTPS_TRUST_STORE_TYPE: JKS
      KC_HTTPS_MANAGEMENT_CLIENT_AUTH: none
      X509_CA_BUNDLE: /etc/x509/https/rootCA.crt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7080/health/ready"]
      interval: 15s
      timeout: 2s
      retries: 15
    restart: unless-stopped
    command: ["start-dev", "--http-port", "7080", "--https-port", "7443", "--import-realm"]
    ports:
      - "7080:7080"
      - "7443:7443"
    volumes:
      - ./keycloak/certs/keycloak.crt:/etc/x509/https/tls.crt
      - ./keycloak/certs/keycloak.key:/etc/x509/https/tls.key
      - ./keycloak/certs/rootCA.crt:/etc/x509/https/rootCA.crt
      - ./keycloak/certs/server.truststore:/etc/x509/https/server.truststore
      - ./keycloak/import:/opt/keycloak/data/import
    depends_on:
      - keycloak-db

  keycloak-db:
    image: postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - keycloakdb-data:/var/lib/postgresql/data

volumes:
  georama-db_data:
  georama-test_data:
  keycloakdb-data:
