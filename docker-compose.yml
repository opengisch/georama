services:
  app:
    image: georama:dev
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./:/app
      - "${GEORAMA_LOCAL_DATA}:/io/data"
    ports:
      - "8080:8000"
  db:
    image: postgis/postgis:14-3.4
    volumes:
      - "db_data:/var/lib/postgresql/data"
    ports:
      - "54321:5432"
    environment:
      - "POSTGRES_USER=${GEORAMA_DB_USER}"
      - "POSTGRES_PASSWORD=${GEORAMA_DB_PW}"
      - "POSTGRES_DB=${GEORAMA_DB_NAME}"
  test_data:
    image: postgis/postgis:14-3.4
    volumes:
      - "test_data:/var/lib/postgresql/data"
    ports:
      - "54322:5432"
    environment:
      - "POSTGRES_USER=${GEORAMA_DB_USER}"
      - "POSTGRES_PASSWORD=${GEORAMA_DB_PW}"
      - "POSTGRES_DB=${GEORAMA_DB_NAME}"
  qsl-redis:
    image: redis:7.4.0
  qsl:
    restart: unless-stopped
    image: ghcr.io/opengisch/qgis-server-light:latest
    env_file:
      - .env
    volumes:
      - "${GEORAMA_LOCAL_DATA}:/io/data"
    deploy:
      replicas: 1
  geogirafe:
    image: geogirafe/viewer:latest
    volumes:
      - ./geogirafe/config.json:/var/www/localhost/htdocs/config.json
    ports:
      - "8443:443"

volumes:
  db_data:
  test_data:
