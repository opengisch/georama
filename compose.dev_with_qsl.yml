services:
  georama:
    environment:
      # prevent `uv run` from re-syncing the venv against uv.lock,
      # which would replace the editable qsl install from the entrypoint
      - "UV_NO_SYNC=1"
      - "DEV_QSL_SOURCES=/qsl"
    volumes:
      - type: bind
        source: "${LOCAL_QSL_SOURCES:?set LOCAL_QSL_SOURCES to your local qgis-server-light checkout}"
        target: "/qsl"
        read_only: true
        bind:
          create_host_path: false
    # healthy as soon as the entrypoint swapped the locked qsl for the mounted sources,
    # until then the venv holds the locked version or none at all (mid install)
    # it does not depend on the started service, so it works with DEV_AUTOSTART=0 too
    healthcheck:
      test: >-
        $$UV_PROJECT_ENVIRONMENT/bin/python -c
        "import qgis_server_light; assert qgis_server_light.__file__.startswith('$$DEV_QSL_SOURCES/')"
      interval: 1s
      timeout: 5s
      retries: 120
  qsl-worker:
    image: local/qsl-worker:dev
    environment:
      - "QSL_LOG_LEVEL=${QSL_WORKER_LOG_LEVEL:-debug}"
      - "DEV_AUTOSTART=${QSL_WORKER_DEV_AUTOSTART:-1}"
    deploy:
      replicas: 1
    build:
      context: "${LOCAL_QSL_SOURCES}"
      target: dev
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    develop:
      watch:
        - action: rebuild
          path: "${LOCAL_QSL_SOURCES}/Dockerfile"
        # scripts are baked into the dev image
        - action: rebuild
          path: "${LOCAL_QSL_SOURCES}/docker/dev.debug.entrypoint.sh"
        - action: rebuild
          path: "${LOCAL_QSL_SOURCES}/docker/dev.start.worker.sh"
    volumes:
      - "${LOCAL_QSL_SOURCES}:/app:cached"
      - "qsl-venv:/home/appuser/.venv"
  qsl-process-worker:
    image: local/qsl-worker:dev
    environment:
      - "QSL_LOG_LEVEL=${QSL_PROCESS_WORKER_LOG_LEVEL:-debug}"
      - "DEV_AUTOSTART=${QSL_PROCESS_WORKER_DEV_AUTOSTART:-1}"
    deploy:
      replicas: 1
    build:
      context: "${LOCAL_QSL_SOURCES}"
      target: dev
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    develop:
      watch:
        - action: rebuild
          path: "${LOCAL_QSL_SOURCES}/Dockerfile"
        # scripts are baked into the dev image
        - action: rebuild
          path: "${LOCAL_QSL_SOURCES}/docker/dev.debug.entrypoint.sh"
        - action: rebuild
          path: "${LOCAL_QSL_SOURCES}/docker/dev.start.worker.sh"
    volumes:
      - "${LOCAL_QSL_SOURCES}:/app:cached"
      - "qsl-venv:/home/appuser/.venv"
  qsl-exporter:
    image: local/qsl-exporter:dev
    environment:
      - "QSL_LOG_LEVEL=${QSL_EXPORTER_LOG_LEVEL:-debug}"
      - "DEV_AUTOSTART=${QSL_EXPORTER_DEV_AUTOSTART:-1}"
    build:
      context: "${LOCAL_QSL_SOURCES}"
      target: dev
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    develop:
      watch:
        - action: rebuild
          path: "${LOCAL_QSL_SOURCES}/Dockerfile"
        # scripts are baked into the dev image
        - action: rebuild
          path: "${LOCAL_QSL_SOURCES}/docker/dev.debug.entrypoint.sh"
        - action: rebuild
          path: "${LOCAL_QSL_SOURCES}/docker/dev.start.exporter_api.sh"
    volumes:
      - "${LOCAL_QSL_SOURCES}:/app:cached"
      - "qsl-venv:/home/appuser/.venv"
    command:
      # standard command in the dev image is the worker start
      # so we overwrite that by the exporterapi start
      - "/usr/local/bin/dev.start.exporter_api.sh"
volumes:
  qsl-venv:
